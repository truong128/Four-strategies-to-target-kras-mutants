# Short peptides aimed at each KRAS allele's mutation site.
# Generated by prepare_targets.py. Paths resolve from this file's directory.
KRAS_G12D_peptide:
  input: ../targets/KRAS_G12D.cif
  contig: 8-16, /0, A3-169
  conditions:
    C_CRDGRP:
      '1':
      - select: sel('A/*/*/[N,CA,C,O]') and not has_nan_coord()
    C_SEQ:
      'true':
      - select: sel('A')
    C_HOT:
      'true':
      - select: sel('A/*/12/[OD1,OD2]')
      - select: sel('A/*/16/[NZ]')
      - select: sel('A/*/59/[CB]')
    C_HB:
      ACCEPTOR:
      - select: sel('A/*/12/[OD1,OD2]')
