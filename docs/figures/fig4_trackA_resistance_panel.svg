   <g id="text_31">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #7f8c8d" transform="translate(15.57 405.042411)">Each component is converted to a percentile rank, then combined with the weights above; Vina scores are not binding free energies.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #7f8c8d" transform="translate(15.57 414.644599)">Caveat built into the method: a WT margin is only meaningful against a matched WT receptor (see docs/SCIENTIFIC_CAVEATS.md).</text>
