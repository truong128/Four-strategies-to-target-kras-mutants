   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="15.012" y="26.347537" transform="rotate(-0 15.012 26.347537)">Track A funnel: design caps at every stage</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7f8c8d" x="15.012" y="40.624688" transform="rotate(-0 15.012 40.624688)">Caps come from config.yaml. They bound the compute at each step; they are not measured outcomes.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.012" y="78.430814" transform="rotate(-0 15.012 78.430814)"> 1.  Enamine REAL library</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="554.04" y="78.430814" transform="rotate(-0 554.04 78.430814)">13.6 billion (streamed)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.012" y="105.39683" transform="rotate(-0 15.012 105.39683)"> 2.  Property pre-filter (Enamine columns)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="554.04" y="105.39651" transform="rotate(-0 554.04 105.39651)">MW 450, sLogP 5, TPSA 140, RotB 10</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.012" y="132.362846" transform="rotate(-0 15.012 132.362846)"> 3.  Representative training sample</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="554.04" y="132.362846" transform="rotate(-0 554.04 132.362846)">200,000 compounds</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.012" y="159.328862" transform="rotate(-0 15.012 159.328862)"> 4.  Vina labels (exhaustiveness 4)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="554.04" y="159.328862" transform="rotate(-0 554.04 159.328862)">top 1% = virtual actives</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.012" y="186.294878" transform="rotate(-0 15.012 186.294878)"> 5.  Classifier screen of the full library</text>
   </g>
   <g id="text_12">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="554.04" y="186.294878" transform="rotate(-0 554.04 186.294878)">keep top 50,000 by probability</text>
   </g>
   <g id="text_13">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.012" y="213.260894" transform="rotate(-0 15.012 213.260894)"> 6.  Vina redock (exhaustiveness 8)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="554.04" y="213.260894" transform="rotate(-0 554.04 213.260894)">50,000 compounds</text>
   </g>
   <g id="text_15">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.012" y="240.22691" transform="rotate(-0 15.012 240.22691)"> 7.  ADMET-AI hard filters</text>
   </g>
   <g id="text_16">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="554.04" y="240.22691" transform="rotate(-0 554.04 240.22691)">hERG, AMES, hepatotoxicity &lt; 0.5</text>
   </g>
   <g id="text_17">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.012" y="267.192926" transform="rotate(-0 15.012 267.192926)"> 8.  Diversity clustering</text>
   </g>
   <g id="text_18">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="554.04" y="267.192926" transform="rotate(-0 554.04 267.192926)">Tanimoto cutoff 0.55</text>
   </g>
   <g id="text_19">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.012" y="294.158942" transform="rotate(-0 15.012 294.158942)"> 9.  Resistance panel + Boltz-2</text>
   </g>
   <g id="text_20">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="554.04" y="294.158942" transform="rotate(-0 554.04 294.158942)">up to 200 compounds</text>
   </g>
   <g id="text_21">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.012" y="321.124958" transform="rotate(-0 15.012 321.124958)">10.  Retrosynthesis (RetroChimera + Retro*)</text>
   </g>
   <g id="text_22">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="554.04" y="321.124958" transform="rotate(-0 554.04 321.124958)">50 compounds</text>
   </g>
   <g id="text_23">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.012" y="348.090654" transform="rotate(-0 15.012 348.090654)">11.  100 ns OpenMM MD + MM/GBSA (+ OpenFE)</text>
   </g>
   <g id="text_24">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="554.04" y="348.090974" transform="rotate(-0 554.04 348.090974)">20 compounds; OpenFE optional</text>
   </g>
   <g id="text_25">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="15.012" y="375.05699" transform="rotate(-0 15.012 375.05699)">12.  Final ranking (Pareto + rank aggregation)</text>
   </g>
   <g id="text_26">
    <text style="font-size: 8.2px; font-family: 'DejaVu Sans'; text-anchor: start" x="554.04" y="375.05699" transform="rotate(-0 554.04 375.05699)">50 reported</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="554.04" y="57.76128" transform="rotate(-0 554.04 57.76128)">Design cap</text>
   </g>
   <g id="text_28">
    <text style="font-weight: 700; font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="15.012" y="57.76128" transform="rotate(-0 15.012 57.76128)">Stage</text>
   </g>
   <g id="text_29">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7f8c8d" x="15.012" y="418.0104" transform="rotate(-0 15.012 418.0104)">Colors: teal = machine-learning triage, orange = physical and ADMET filters, purple = shortlist-only expensive modeling.</text>
   </g>
  </g>
