   <g id="text_1">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="13.059" y="25.250456" transform="rotate(-0 13.059 25.250456)">Track A funnel: design caps at every stage</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5f6b73" x="13.059" y="44.957797" transform="rotate(-0 13.059 44.957797)">Caps come from config.yaml. They bound the compute at each step; they are not measured outcomes.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="13.059" y="64.8576" transform="rotate(-0 13.059 64.8576)">Stage</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="429.048" y="64.8576" transform="rotate(-0 429.048 64.8576)">Design cap</text>
   </g>
   <g id="text_5">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.059" y="83.422367" transform="rotate(-0 13.059 83.422367)"> 1.  Enamine REAL library</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="429.048" y="83.964164" transform="rotate(-0 429.048 83.964164)">13.6 billion (streamed)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.059" y="109.590047" transform="rotate(-0 13.059 109.590047)"> 2.  Property pre-filter</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(429.048 103.663094)">MW 450, sLogP 5,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(429.048 116.121687)">TPSA 140, RotB 10</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.059" y="135.757727" transform="rotate(-0 13.059 135.757727)"> 3.  Representative training sample</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="429.048" y="135.919055" transform="rotate(-0 429.048 135.919055)">200,000 compounds</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.059" y="161.925407" transform="rotate(-0 13.059 161.925407)"> 4.  Vina labels (exhaustiveness 4)</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="429.048" y="162.086735" transform="rotate(-0 429.048 162.086735)">top 1% = virtual actives</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.059" y="188.093087" transform="rotate(-0 13.059 188.093087)"> 5.  Classifier screen, full library</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="429.048" y="188.254415" transform="rotate(-0 429.048 188.254415)">keep top 50,000</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.059" y="214.260767" transform="rotate(-0 13.059 214.260767)"> 6.  Vina redock (exhaustiveness 8)</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="429.048" y="214.422095" transform="rotate(-0 429.048 214.422095)">50,000 compounds</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.059" y="240.428447" transform="rotate(-0 13.059 240.428447)"> 7.  ADMET-AI hard filters</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(429.048 234.589775)">hERG, AMES, hepato-</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(429.048 246.589775)">toxicity &lt; 0.5</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.059" y="266.596127" transform="rotate(-0 13.059 266.596127)"> 8.  Diversity clustering</text>
   </g>
   <g id="text_20">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="429.048" y="267.726205" transform="rotate(-0 429.048 267.726205)">Tanimoto cutoff 0.55</text>
   </g>
   <g id="text_21">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.059" y="292.763807" transform="rotate(-0 13.059 292.763807)"> 9.  Resistance panel + Boltz-2</text>
   </g>
   <g id="text_22">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="429.048" y="292.925135" transform="rotate(-0 429.048 292.925135)">up to 200 compounds</text>
   </g>
   <g id="text_23">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.059" y="318.931487" transform="rotate(-0 13.059 318.931487)">10.  Retrosynthesis</text>
   </g>
   <g id="text_24">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="429.048" y="319.092815" transform="rotate(-0 429.048 319.092815)">50 compounds</text>
   </g>
   <g id="text_25">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.059" y="345.098776" transform="rotate(-0 13.059 345.098776)">11.  MD + MM/GBSA (+ OpenFE)</text>
   </g>
   <g id="text_26">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(429.048 339.260495)">20 compounds, 100 ns;</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(429.048 351.260495)">OpenFE optional</text>
   </g>
   <g id="text_27">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="13.059" y="371.266847" transform="rotate(-0 13.059 371.266847)">12.  Final ranking</text>
   </g>
   <g id="text_28">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="429.048" y="371.428175" transform="rotate(-0 429.048 371.428175)">50 reported</text>
   </g>
   <g id="text_29">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="32.9796" y="433.359647" transform="rotate(-0 32.9796 433.359647)">ML triage</text>
   </g>
   <g id="text_30">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="115.29855" y="433.359647" transform="rotate(-0 115.29855 433.359647)">physical + ADMET filters</text>
   </g>
   <g id="text_31">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start" x="281.10825" y="433.359647" transform="rotate(-0 281.10825 433.359647)">shortlist-only modeling</text>
