   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #5f6b73" x="13.059" y="48.727717" transform="rotate(-0 13.059 48.727717)">Model selection never touches the locked test set. Scaffold-separated partitions replace temporal ones.</text>
   </g>
