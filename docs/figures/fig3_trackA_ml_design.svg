   <g id="text_1">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f3a5f" x="15.57" y="25.859665" transform="rotate(-0 15.57 25.859665)">Track A machine-learning design</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7f8c8d" x="15.57" y="39.205424" transform="rotate(-0 15.57 39.205424)">Model selection never touches the locked test set. Scaffold-separated partitions replace temporal ones.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(45.0575 101.94954)">Vina scores on</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(39.265 111.17454)">200,000 sampled</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(53.853125 121.94954)">molecules</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(74.16 128.96704)"/>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(41.935 141.17454)">top 1% = active</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(207.46125 101.17454)">Scaffold split</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(213.7025 111.94954)">train 0.65</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(203.31875 121.94954)">validation 0.15</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(201.8425 131.94954)">calibration 0.10</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(201.1275 141.94954)">locked test 0.10</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(382.849375 101.94954)">20 classifiers</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(361.18625 111.478915)">16 classical (BRFSS set)</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(368.76875 121.94954)">+ FT-Transformer x2</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(387.62125 131.94954)">+ RealMLP</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(374.385 141.94954)">+ Tabular ResNet</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(549.355625 101.94954)">Select on validation</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(553.4225 111.17454)">best single model</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(553.825 121.17454)">vs top-3 soft vote</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(555.47875 131.17454)">(metric: average</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(569.309375 141.17454)">precision)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(722.48625 106.94954)">Isotonic calibration</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(722.4475 116.94954)">+ class-conditional</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(730.744375 126.17454)">split conformal</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(732.911875 136.17454)">(epsilon 0.15)</text>
   </g>
