   </g>
   <g id="text_10">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'" transform="translate(724.806125 239.275855)">Chunked inference</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'" transform="translate(719.89225 248.039605)">(9 production-eligible</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'" transform="translate(711.943125 257.539605)">models, 4,000 per chunk,</text>
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'" transform="translate(714.371563 267.328761)">26 workers + 2 readers)</text>
   </g>
