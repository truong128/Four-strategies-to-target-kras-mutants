   <g id="text_8">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(216.41625 242.89998)">Features: ECFP4 (radius 2, 2048 bits) + 10 descriptors</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(227.0225 252.89998)">SMOTE intentionally NOT used on fingerprint bits</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(201.11375 262.89998)">Enrichment and recall reported because actives are about 1%</text>
   </g>
   <g id="text_9">
