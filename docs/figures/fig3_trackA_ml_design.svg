   <g id="text_17">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5f6b73" transform="translate(13.059 447.130206)">Features: ECFP4 (radius 2, 2048 bits) + 10 descriptors. SMOTE is intentionally not used on fingerprint bits.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5f6b73" transform="translate(13.059 461.380206)">Actives are about 1%, so enrichment and recall are reported next to accuracy.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #5f6b73" transform="translate(13.059 475.630206)">Slow benchmark models are row-capped and reported, but cannot become production models.</text>
   </g>
